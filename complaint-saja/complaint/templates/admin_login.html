<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Complaints Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg: #F5F3F0;
            --card: #FFFFFF;
            --text: #3C3C3C;
            --label: #6B6B6B;
            --input-bg: #FBF9F7;
            --input-border: #E2DDD6;
            --focus: #9BB8B0;
            --button: #7D9B8A;
            --button-hover: #6C8A79;
            --error-bg: #F6EAE7;
            --error-text: #B26B5C;
            --shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            text-align: center;
            transition: var(--transition);
        }

        .icon-container {
            background-color: var(--input-bg);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: var(--button);
            font-size: 24px;
            border: 1px solid var(--input-border);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        p.subtitle {
            color: var(--label);
            font-size: 15px;
            margin-bottom: 32px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--label);
            margin-bottom: 8px;
            margin-left: 4px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            color: var(--text);
            transition: var(--transition);
            outline: none;
        }

        input:focus {
            border-color: var(--focus);
            box-shadow: 0 0 0 4px rgba(155, 184, 176, 0.15);
            background-color: #fff;
        }



        .login-button {
            width: 100%;
            padding: 14px;
            background-color: var(--button);
            color: white;
            border: none;
            border-radius: 20px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 24px;
        }

        .login-button:hover {
            background-color: var(--button-hover);
            transform: translateY(-1px);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .create-account {
            font-size: 14px;
            color: var(--label);
        }

        .create-account a {
            color: var(--button);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }

        .create-account a:hover {
            color: var(--button-hover);
        }

        .error-message {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Flask Flash Messages */
        .flash-messages {
            margin-bottom: 20px;
        }

        .flash-message {
            background-color: var(--error-bg);
            color: var(--error-text);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            text-align: left;
            margin-bottom: 8px;
        }

        .flash-message.success {
            background-color: #E8F5E9;
            color: #2E7D32;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="icon-container">
            <i class="bi bi-shield-check"></i>
        </div>

        <h1>Admin Portal</h1>
        <p class="subtitle">Enter admin credentials to access the management dashboard.</p>

        <div id="flash-container" class="flash-messages">
            {% with msgs = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in msgs %}
            <div class="flash-message {{ 'success' if cat=='success' else '' }}">
                {{ msg }}
            </div>
            {% endfor %}
            {% endwith %}
        </div>

        <div id="validation-error" class="error-message"></div>

        <form id="loginForm" method="POST" action="/admin/login">
            <div class="form-group">
                <label for="username">Admin Username</label>
                <input type="text" name="username" id="username" placeholder="Admin Username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Admin Password</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-button" id="submitBtn">Admin Sign In</button>
        </form>

        <div class="create-account">
            <a href="/login">Regular User Login</a>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const validationError = document.getElementById('validation-error');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        loginForm.addEventListener('submit', function (e) {
            validationError.style.display = 'none';
            if (!usernameInput.value.trim() || !passwordInput.value.trim()) {
                e.preventDefault();
                validationError.textContent = "Please enter both username and password.";
                validationError.style.display = 'block';
            }
        });
    </script>
</body>

</html>
